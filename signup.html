<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- css -->
    <link rel="stylesheet" href="css/style.css">

    <title>Signup</title>

</head>

<body class="signuppage">

    <div class="container">

        <div class="row justify-content-center mt-5">

            <div class="col-12 col-md-6">

                <div class="border rounded shadow p-4 singn-block">

                    <form>

                        <h1 class="text-center mb-4">
                            Sign Up
                        </h1>


                        <!-- full name -->

                        <div class="mb-3">

                            <label for="fullname" class="form-label">
                                Full Name
                            </label>

                            <input type="text" id="fullname" name="fullname" placeholder="Enter Full Name"
                                class="form-control" required>

                        </div>


                        <!-- email -->

                        <div class="mb-3">

                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input type="email" id="email" name="email" placeholder="Enter Email" class="form-control"
                                required>

                        </div>


                        <!-- phone -->

                        <div class="mb-3">

                            <label for="phone" class="form-label">
                                Phone No
                            </label>

                            <input type="number" name="phone" id="phone" placeholder="Enter Phone no"
                                class="form-control">

                        </div>


                        <!-- password -->

                        <div class="mb-3">

                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input type="password" name="password" id="password" placeholder="Enter Password"
                                class="form-control" required>

                            <div id="passwordError" class="text-danger mt-1"></div>

                        </div>


                        <!-- confirm password -->



                        <div class="mb-3">

                            <label for="confirmpassword" class="form-label">
                                Confirm Password
                            </label>

                            <input type="password" name="confirmpassword" id="confirmpassword"
                                placeholder="Enter Confirm Password" class="form-control" required>

                            <div id="confirmPasswordError" class="text-danger mt-1"></div>

                        </div>


                        <!-- register button -->

                        <div class="text-center">

                            <button type="submit" class="btn btn-success register-btn">
                                Register
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- javascript -->
    <script src="Js/script.js"></script>

</body>

</html>
